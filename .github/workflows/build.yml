name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Build release APKs
        run: ./gradlew assembleRelease --no-daemon
      - name: Rename APKs
        run: |
          mkdir dist
          for f in app/build/outputs/apk/release/*.apk; do
            n=$(basename "$f" | sed 's/^app-/ReelDJ-/; s/-release//')
            cp "$f" "dist/$n"
          done
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: ReelDJ-apks
          path: dist/*.apk
      - name: Read version
        id: ver
        run: echo "name=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)" >> "$GITHUB_OUTPUT"
      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.name }}
          name: ReelDJ ${{ steps.ver.outputs.name }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: dist/*.apk
